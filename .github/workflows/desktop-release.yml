name: Desktop release

# Push a tag like `desktop-v0.2.0` (matching desktop/package.json "version") to build the Windows
# installer and publish it to GitHub Releases, together with the `latest.yml` metadata that
# electron-updater reads. Installed copies of Zer0 check that feed and update themselves.
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag=${GITHUB_REF_NAME#desktop-v}
          if [ "$pkg" != "$tag" ]; then echo "Tag $tag does not match package.json $pkg"; exit 1; fi
      - name: Create the v<version> tag that GitHub releases use
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          ver=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$ver" >/dev/null 2>&1; then
            echo "Tag v$ver already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$ver" "$GITHUB_SHA"
          git push origin "v$ver"
      - run: npm ci
      - run: npm test
      - name: Build Windows installer
        env:
          # Optional code signing. Without these the installer is unsigned and Windows SmartScreen will warn.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --publish never
      - name: Publish the release files installed copies update from
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "require('./package.json').version")
          exe="release/Zer0-Setup-${ver}-x64.exe"
          for f in "$exe" release/latest.yml; do
            if [ ! -f "$f" ]; then echo "Missing build output: $f"; ls -la release; exit 1; fi
          done
          # The blockmap only makes updates smaller, so it is optional.
          files=("$exe" release/latest.yml)
          if [ -f "$exe.blockmap" ]; then files+=("$exe.blockmap"); fi
          # Replace any earlier, incomplete release for this version, then publish the files.
          gh release delete "v$ver" --yes >/dev/null 2>&1 || true
          gh release create "v$ver" "${files[@]}" --title "Zer0 $ver" --notes "Zer0 desktop $ver" --latest
